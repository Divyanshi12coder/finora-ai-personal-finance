[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_default_fixture_loop_scope = function
addopts =
    -ra
    --strict-markers
    --tb=short
filterwarnings =
    ignore::DeprecationWarning:starlette.testclient
markers =
    slow: tests that take more than a couple of seconds
