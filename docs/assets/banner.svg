<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Finora — AI-powered personal finance platform">
  <title>Finora — Your Money. Understood by AI.</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1F3A"/>
      <stop offset="0.62" stop-color="#132B4F"/>
      <stop offset="1" stop-color="#1B3660"/>
    </linearGradient>

    <linearGradient id="markGrad" x1="0" y1="0" x2="76" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4ECF6"/>
    </linearGradient>

    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.16"/>
    </linearGradient>

    <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E63946" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#E63946" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E63946" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#E63946" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#grid)"/>
  <circle cx="1090" cy="120" r="260" fill="url(#glow)"/>

  <!-- ===== Left: brand and message ===== -->
  <g transform="translate(88, 96)">
    <!-- Logo mark -->
    <g>
      <rect width="76" height="76" rx="21" fill="url(#markGrad)"/>
      <path d="M17 51L30 38L39.5 47.5L47.5 32" fill="none" stroke="#0B1F3A" stroke-width="5.6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M47.5 32L59.5 20" fill="none" stroke="#E63946" stroke-width="5.6" stroke-linecap="round"/>
      <circle cx="59.5" cy="20" r="6.2" fill="#E63946"/>
    </g>

    <text x="96" y="36" font-family="'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif" font-size="46" font-weight="800" fill="#FFFFFF" letter-spacing="-1.2">Finora</text>
    <text x="97" y="64" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="14.5" font-weight="600" fill="#E63946" letter-spacing="2.6">AI PERSONAL FINANCE</text>

    <!-- Headline -->
    <text y="146" font-family="'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif" font-size="40" font-weight="800" fill="#FFFFFF" letter-spacing="-1">Your money. Understood by AI.</text>

    <text y="184" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="17" fill="#FFFFFF" fill-opacity="0.74">Every figure computed from your records. AI explains them —</text>
    <text y="210" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="17" fill="#FFFFFF" fill-opacity="0.74">it never invents the number.</text>

    <!-- Capability chips -->
    <g font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="600">
      <g transform="translate(0, 236)">
        <rect width="152" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.09" stroke="#FFFFFF" stroke-opacity="0.16"/>
        <circle cx="19" cy="16" r="3.4" fill="#E63946"/>
        <text x="32" y="20.5" fill="#FFFFFF" fill-opacity="0.92">ML categorisation</text>
      </g>
      <g transform="translate(164, 236)">
        <rect width="112" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.09" stroke="#FFFFFF" stroke-opacity="0.16"/>
        <circle cx="19" cy="16" r="3.4" fill="#E63946"/>
        <text x="32" y="20.5" fill="#FFFFFF" fill-opacity="0.92">Receipt OCR</text>
      </g>
      <g transform="translate(288, 236)">
        <rect width="118" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.09" stroke="#FFFFFF" stroke-opacity="0.16"/>
        <circle cx="19" cy="16" r="3.4" fill="#E63946"/>
        <text x="32" y="20.5" fill="#FFFFFF" fill-opacity="0.92">Forecasting</text>
      </g>
      <g transform="translate(418, 236)">
        <rect width="148" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.09" stroke="#FFFFFF" stroke-opacity="0.16"/>
        <circle cx="19" cy="16" r="3.4" fill="#E63946"/>
        <text x="32" y="20.5" fill="#FFFFFF" fill-opacity="0.92">Grounded assistant</text>
      </g>
    </g>
  </g>

  <!-- ===== Right: dashboard vignette ===== -->
  <g transform="translate(756, 74)">
    <rect width="436" height="258" rx="18" fill="#FFFFFF" fill-opacity="0.055" stroke="#FFFFFF" stroke-opacity="0.14"/>

    <!-- Window chrome -->
    <circle cx="26" cy="26" r="4.5" fill="#E63946" fill-opacity="0.75"/>
    <circle cx="42" cy="26" r="4.5" fill="#FFFFFF" fill-opacity="0.32"/>
    <circle cx="58" cy="26" r="4.5" fill="#FFFFFF" fill-opacity="0.32"/>
    <text x="78" y="30" font-family="Inter,system-ui,sans-serif" font-size="11" fill="#FFFFFF" fill-opacity="0.45">Dashboard</text>

    <line x1="0" y1="46" x2="436" y2="46" stroke="#FFFFFF" stroke-opacity="0.1"/>

    <!-- Metric tiles -->
    <g font-family="Inter,system-ui,sans-serif">
      <g transform="translate(24, 64)">
        <rect width="120" height="52" rx="10" fill="#FFFFFF" fill-opacity="0.07"/>
        <text x="12" y="20" font-size="9.5" fill="#FFFFFF" fill-opacity="0.5">Income</text>
        <text x="12" y="39" font-size="15" font-weight="700" fill="#FFFFFF">₹1,56,600</text>
      </g>
      <g transform="translate(156, 64)">
        <rect width="120" height="52" rx="10" fill="#E63946" fill-opacity="0.16"/>
        <text x="12" y="20" font-size="9.5" fill="#FFFFFF" fill-opacity="0.5">Expenses</text>
        <text x="12" y="39" font-size="15" font-weight="700" fill="#FF8A94">₹78,420</text>
      </g>
      <g transform="translate(288, 64)">
        <rect width="124" height="52" rx="10" fill="#FFFFFF" fill-opacity="0.07"/>
        <text x="12" y="20" font-size="9.5" fill="#FFFFFF" fill-opacity="0.5">Health score</text>
        <text x="12" y="39" font-size="15" font-weight="700" fill="#FFFFFF">74 · Good</text>
      </g>
    </g>

    <!-- Chart: bars with a red trend overlay -->
    <g transform="translate(24, 136)">
      <line x1="0" y1="86" x2="388" y2="86" stroke="#FFFFFF" stroke-opacity="0.12"/>

      <g fill="url(#barGrad)">
        <rect x="6"   y="44" width="26" height="42" rx="4"/>
        <rect x="46"  y="30" width="26" height="56" rx="4"/>
        <rect x="86"  y="52" width="26" height="34" rx="4"/>
        <rect x="126" y="22" width="26" height="64" rx="4"/>
        <rect x="166" y="38" width="26" height="48" rx="4"/>
        <rect x="206" y="14" width="26" height="72" rx="4"/>
        <rect x="246" y="34" width="26" height="52" rx="4"/>
        <rect x="286" y="8"  width="26" height="78" rx="4"/>
        <rect x="326" y="26" width="26" height="60" rx="4"/>
      </g>

      <path d="M19 62 L59 54 L99 68 L139 46 L179 58 L219 36 L259 50 L299 28 L339 40"
            fill="none" stroke="#E63946" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M19 62 L59 54 L99 68 L139 46 L179 58 L219 36 L259 50 L299 28 L339 40 L339 86 L19 86 Z"
            fill="url(#areaGrad)"/>

      <circle cx="339" cy="40" r="4.2" fill="#E63946"/>
      <circle cx="339" cy="40" r="8" fill="#E63946" fill-opacity="0.22"/>
    </g>
  </g>

  <!-- Bottom accent rule -->
  <rect x="0" y="396" width="1280" height="4" fill="#E63946" fill-opacity="0.9"/>
</svg>
